<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweet Cake Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #fff5f7;
            color: #333;
        }

        /* Navbar */
        nav {
            display: flex;
            justify-content: space-between;
            padding: 20px 60px;
            background: #ff6f91;
            color: white;
        }

        nav h1 {
            font-size: 24px;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 20px;
        }

        nav ul li {
            cursor: pointer;
        }

        /* Hero Section */
        .hero {
            height: 80vh;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 50px 60px;
        }

        .hero-text h2 {
            font-size: 48px;
            color: #ff4d6d;
        }

        .hero-text p {
            margin: 20px 0;
            font-size: 18px;
        }

        .hero-text button {
            padding: 12px 25px;
            background: #ff4d6d;
            border: none;
            color: white;
            border-radius: 25px;
            cursor: pointer;
        }

        .hero img {
            width: 400px;
        }

        /* Cakes Section */
        .cakes {
            padding: 50px 60px;
            text-align: center;
        }

        .cakes h2 {
            margin-bottom: 30px;
            font-size: 32px;
            color: #ff4d6d;
        }

        .cake-container {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .cake-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            width: 250px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .cake-card img {
            width: 100%;
            border-radius: 10px;
        }

        .cake-card h3 {
            margin: 10px 0;
        }

        .cake-card button {
            margin-top: 10px;
            padding: 8px 20px;
            background: #ff6f91;
            border: none;
            color: white;
            border-radius: 20px;
            cursor: pointer;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 20px;
            background: #ff6f91;
            color: white;
            margin-top: 40px;
        }

        /* Responsive */
        @media(max-width: 768px) {
            .hero {
                flex-direction: column;
                text-align: center;
            }

            .hero img {
                margin-top: 20px;
                width: 300px;
            }
        }

    </style>
</head>
<body>

    <!-- Navbar -->
    <nav>
        <h1>🍰 Sweet Cake</h1>
        <ul>
            <li>Home</li>
            <li>Cakes</li>
            <li>About</li>
            <li>Contact</li>
        </ul>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-text">
            <h2>Delicious Cakes Made With Love</h2>
            <p>Order your favorite cakes for every occasion. Fresh, tasty & beautiful designs.</p>
            <button>Order Now</button>
        </div>
        
    </section>

    <!-- Cakes Section -->
    <section class="cakes">
        <h2>Our Special Cakes</h2>

        <div class="cake-container">
            <div class="cake-card">
                <img src="https://images.unsplash.com/photo-1601972599720-36938d4ecd31">
                <h3>Chocolate Cake</h3>
                <p>₹500</p>
                <button>Buy Now</button>
            </div>

            <div class="cake-card">
                <img src="https://images.unsplash.com/photo-1614707267537-b85aaf00c4b7">
                <h3>Strawberry Cake</h3>
                <p>₹600</p>
                <button>Buy Now</button>
            </div>

            <div class="cake-card">
                <img src="https://images.unsplash.com/photo-1606890737304-57a1ca8a5b62">
                <h3>Vanilla Cake</h3>
                <p>₹450</p>
                <button>Buy Now</button>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>© 2026 Sweet Cake Shop | Made with ❤️</p>
    </footer>

</body>
</html>
